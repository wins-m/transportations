            width: 170px;

        }

        }

            max-height: 300px;

                font-size: 12px;
                padding: 7px;
            }

                bottom: env(safe-area-inset-bottom, 0px);
            }

            .leaflet-left {
                left: env(safe-area-inset-left, 0px);
            }

            .leaflet-right {
                right: env(safe-area-inset-right, 0px);

            .legend,

                max-width: 44vw;
                max-height: 40vh;
                overflow-y: auto;
            }

            .stats-panel {
                min-width: 0;
            }
        }

			{'type': 'Other', 'date': '2025-09-18', 'from': '青岛崂山区', 'to': '滨州无棣县', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-18', 'from': '滨州无棣县', 'to': '天津津南区', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-19', 'from': '天津津南', 'to': '河北三河市', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-20', 'from': '河北三河市', 'to': '北京朝阳区', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-21', 'from': '北京朝阳区', 'to': '北京延庆区', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-22', 'from': '北京延庆区', 'to': '张家口张北县', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-23', 'from': '张家口张北县', 'to': '锡林格勒多伦县', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-24', 'from': '锡林格勒多伦县', 'to': '赤峰红山区', 'vehicle': '-', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Railway', 'date': '2025-09-25', 'from': '赤峰站', 'to': '沈阳站', 'vehicle': 'C1160', 'time': '16:39-19:50', 'duration': '03:11:00', 'distance': '498 km', 'seat': '02车16C号', 'price': 182, 'note': '-'}, 
			{'type': 'Airline', 'date': '2025-09-28', 'from': '沈阳桃仙机场', 'to': '宁波栎社机场', 'vehicle': '9C8731', 'time': '14:16-16:29', 'duration': '02:13:00', 'distance': '1994 km', 'seat': '15A', 'price': 429, 'note': '-'}, 
			{'type': 'Other', 'date': '2025-09-28', 'from': '宁波栎社机场', 'to': '新城汽车客运站', 'vehicle': '66026', 'time': '17:40-19:35', 'duration': '01:55:00', 'distance': '104 km', 'seat': 19, 'price': 70, 'note': '-'}, 
			{'type': 'Other', 'date': '2025-11-12', 'from': '新城汽车客运站', 'to': '杭州东站汽车站', 'vehicle': '2037', 'time': '09:20-12:50', 'duration': '03:30:00', 'distance': '226 km', 'seat': 4, 'price': 110, 'note': '法签'}, 
			{'type': 'Other', 'date': '2025-11-12', 'from': '杭州东站汽车站', 'to': '新城汽车客运站', 'vehicle': '2094', 'time': '17:40-20:30', 'duration': '02:50:00', 'distance': '226 km', 'seat': 11, 'price': 110, 'note': '-'}, 
			{'type': 'Other', 'date': '2026-04-27', 'from': '新城汽车客运站', 'to': '杭州东站汽车站', 'vehicle': '0900', 'time': '10:20-13:50', 'duration': '03:30:00', 'distance': '226 km', 'seat': 1, 'price': 110, 'note': '-'}, 
			{'type': 'Other', 'date': '2026-04-30', 'from': '杭州杨家山', 'to': '安吉古城遗址公园', 'vehicle': '包车', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2026-05-02', 'from': '安吉古城遗址公园', 'to': '杭州黄龙洞', 'vehicle': '包车', 'time': '-', 'duration': '', 'distance': ''-' km', 'seat': '-', 'price': '-', 'note': '-'}, 
			{'type': 'Other', 'date': '2026-05-03', 'from': '杭州东站汽车站', 'to': '新城汽车客运站', 'vehicle': '7022', 'time': '15:20-18:40', 'duration': '03:20:00', 'distance': '226 km', 'seat': 6, 'price': 110, 'note': '-'}];

        // 颜色映射
        const typeColors = { Railway: 'blue', Airline: 'red', Other: 'black' };

        // ========= 方案1：合并相同路线 =========
        const routeGroups = {};
        travelSegments.forEach(segment => {
            const key = `${segment.from}-${segment.to}`;
            const key_rvs = `${segment.to}-${segment.from}`;
            if (!routeGroups[key]) {
                if (!routeGroups[key_rvs]) {
                    routeGroups[key] = {
                        type: segment.type,
                        segments: [],
                        polyline: null,
                    };
                    routeGroups[key].segments.push(segment);
                } else {
                    routeGroups[key_rvs].segments.push(segment);
                    return;
                }
            } else {
                routeGroups[key].segments.push(segment);
            }
        });

        // ========= 方案5：交互式筛选控件 =========
        // 获取所有年份，去重排序
        const years = Array.from(new Set(travelSegments.map(seg => seg.date.slice(0, 4)))).sort();
        // 首页默认显示当前年份（数据中无当前年份行程时回退为「所有年份」）
        const currentYear = String(new Date().getFullYear());
        const defaultYear = years.includes(currentYear) ? currentYear : 'all';

        const controlPanel = L.control({ position: 'topright' });
        controlPanel.onAdd = () => {
            const div = L.DomUtil.create('div', 'control-panel');
            div.innerHTML = `
                            <h4 style="margin:0 0 8px 0">筛选条件</h4>
                            <select id="route-type" style="width:100%;margin-bottom:6px">
                                <option value="all">所有类型</option>
                                <option value="Railway">铁路</option>
                                <option value="Airline">航空</option>
                                <option value="Other">其他</option>
                            </select>
                            <select id="route-year" style="width:100%;margin-bottom:6px">
                                <option value="all" ${defaultYear === 'all' ? 'selected' : ''}>所有年份</option>
                                ${years.map(y => `<option value="${y}" ${y === defaultYear ? 'selected' : ''}>${y}年</option>`).join('')}
                            </select>
                            <label style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
                                <input type="checkbox" id="toggle-heat" checked> 热力图
                            </label>
                            <div id="route-count" style="margin-top:5px;font-size:0.8em">
                                共 ${travelSegments.length} 次行程
                            </div>
                        `;
            // Stop map drag/zoom when interacting with the panel.
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        controlPanel.addTo(map);

        // ========= 绘制合并路线 =========
        Object.entries(routeGroups).forEach(([key, group]) => {
            const from = locCoords[group.segments[0].from];
            const to = locCoords[group.segments[0].to];

            // 创建路线（线宽反映行程次数）
            group.polyline = L.polyline([from, to], {
                color: typeColors[group.type],
                weight: 5 + Math.min(group.segments.length / 2, 10), // 频次越高越粗
                opacity: 0.4 + Math.min(group.segments.length * 0.05, 0.6),
                _routeType: group.type // 自定义属性用于筛选
            }).addTo(map);

            // 合并弹窗内容
            const popupContent = `
                <div class="route-popup">
                  <b>${group.segments[0].from} → ${group.segments[0].to}</b>
                  <small>（${group.segments[0].distance}, 共 ${group.segments.length} 次行程）</small>
                  <hr>
                  ${group.segments.map(trip => `
                    <div style="margin-bottom:8px;padding-bottom:5px;border-bottom:1px dashed #eee">
                      <div style="display:flex;justify-content:space-between">
                        <span>${trip.from === group.segments[0].from ? '➡️' : '⬅️'} ${trip.date}</span>
                        <span style="color:${typeColors[trip.type]}">${trip.type === 'Railway' ? '🚄' : trip.type === 'Airline' ? '✈️' : '🚌'} ${trip.vehicle}</span>
                      </div>
                      <div style="display:flex;justify-content:space-between">
                        <span>${trip.time} | ${trip.seat} | ¥${trip.price}</span>
                        <span> [${trip.note}]</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `;
            group.polyline.bindPopup(popupContent);
        });

        // ========= 筛选功能 =========


        function updateRouteFilter() {
            const selectedType = document.getElementById('route-type').value;
            const selectedYear = document.getElementById('route-year').value;
            let visibleCount = 0;
            // 收集当前可见路线两端的站点，供图钉联动使用
            const visibleStations = new Set();
            // 收集当前筛选命中的行程，供统计面板联动使用
            const visibleSegments = [];

            Object.values(routeGroups).forEach(group => {
                // 判断该组内是否有符合条件的行程
                const filteredSegments = group.segments.filter(seg => {
                    const typeMatch = selectedType === 'all' || seg.type === selectedType;
                    const yearMatch = selectedYear === 'all' || seg.date.slice(0, 4) === selectedYear;
                    return typeMatch && yearMatch;
                });
                const isVisible = filteredSegments.length > 0;
                if (isVisible) {
                    if (!map.hasLayer(group.polyline)) {
                        group.polyline.addTo(map);
                    }
                    // 用筛选后数量决定 weight/opacity
                    const segCount = filteredSegments.length;
                    group.polyline.setStyle({
                        weight: 5 + Math.min(segCount / 2, 10),
                        opacity: 0.4 + Math.min(segCount * 0.05, 0.6)
                    });
                    // 更新弹窗内容为筛选后的行程
                    const popupContent = `
                        <div class="route-popup">
                          <b>${group.segments[0].from} → ${group.segments[0].to}</b>
                          <small>（${filteredSegments[0]?.distance || ''}, 共 ${segCount} 次行程）</small>
                          <hr>
                          ${filteredSegments.map(trip => `
                            <div style="margin-bottom:8px;padding-bottom:5px;border-bottom:1px dashed #eee">
                              <div style="display:flex;justify-content:space-between">
                                <span>${trip.from === group.segments[0].from ? '➡️' : '⬅️'} ${trip.date}</span>
                                <span style="color:${typeColors[trip.type]}">${trip.type === 'Railway' ? '🚄' : trip.type === 'Airline' ? '✈️' : '🚌'} ${trip.vehicle}</span>
                              </div>
                              <div style="display:flex;justify-content:space-between">
                                <span>${trip.time} | ${trip.seat} | ¥${trip.price}</span>
                                <span> [${trip.note}]</span>
                              </div>
                            </div>
                          `).join('')}
                        </div>
                      `;
                    group.polyline.bindPopup(popupContent);
                    visibleStations.add(group.segments[0].from);
                    visibleStations.add(group.segments[0].to);
                    visibleCount += segCount;
                    filteredSegments.forEach(seg => visibleSegments.push(seg));
                } else {
                    if (map.hasLayer(group.polyline)) {
                        map.removeLayer(group.polyline);
                    }
                }
            });

            // 站点图钉随筛选联动：只显示当前可见路线两端的站点
            Object.entries(stationMarkers).forEach(([name, marker]) => {
                if (visibleStations.has(name)) {
                    if (!map.hasLayer(marker)) marker.addTo(map);
                } else {
                    if (map.hasLayer(marker)) map.removeLayer(marker);
                }
            });

            document.getElementById('route-count').textContent =
                `显示 ${visibleCount}/${travelSegments.length} 次行程`;

            // 统计面板随筛选联动
            updateStats(visibleSegments, visibleStations);

            // 视图随筛选联动：仅以当前筛选命中的站点为中心自动缩放
            const visibleLatLngs = [];
            visibleStations.forEach(name => {
                if (locCoords[name]) visibleLatLngs.push(L.latLng(locCoords[name]));
            });
            if (visibleLatLngs.length > 0) {
                map.fitBounds(L.latLngBounds(visibleLatLngs), { padding: [50, 50], maxZoom: 9 });
            }
        }

        document.getElementById('route-type').addEventListener('change', updateRouteFilter);
        document.getElementById('route-year').addEventListener('change', updateRouteFilter);

        // ========= 图例和标记 =========
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = () => {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
              <h4 style="margin:4px 0">图例</h4>
              <div style="display:flex;align-items:center;gap:6px">
                <div style="background:blue;width:16px;height:16px"></div>
                <span>铁路</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px">
                <div style="background:red;width:16px;height:16px"></div>
                <span>航空</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;margin:4px 0">
                <div style="background:black;width:16px;height:16px"></div>
                <span>其他</span>
              </div>
            `;
            return div;
        };
        legend.addTo(map);

        // 添加城市标记
        const smallIcon = L.icon({
            iconUrl: 'https://unpkg.com/leaflet/dist/images/marker-icon.png',
            iconSize: [10, 15],
            iconAnchor: [5, 15]
        });

        // 计算每个城市的首次出发和首次抵达日期
        const cityFirstArrive = {};
        const cityFirstDepart = {};
        travelSegments.forEach(seg => {
            // 统计到达城市
            const toCity = seg.to;
            if (!cityFirstArrive[toCity] || seg.date < cityFirstArrive[toCity]) {
                cityFirstArrive[toCity] = seg.date;
            }
            // 统计出发城市
            const fromCity = seg.from;
            if (!cityFirstDepart[fromCity] || seg.date < cityFirstDepart[fromCity]) {
                cityFirstDepart[fromCity] = seg.date;
            }
        });

        // 图钉按站点名缓存，可见性由筛选器控制（见 updateRouteFilter）
        const stationMarkers = {};
        Object.entries(locCoords).forEach(([name, coords]) => {
            let popup = `<b>${name}</b><br>坐标: ${coords[0].toFixed(4)}, ${coords[1].toFixed(4)}`;
            const arrive = cityFirstArrive[name];
            const depart = cityFirstDepart[name];
            let showType = null, showDate = null;
            if (arrive && depart) {
                if (depart < arrive) {
                    showType = '首次出发';
                    showDate = depart;
                } else {
                    showType = '首次抵达';
                    showDate = arrive;
                }
            } else if (depart) {
                showType = '首次出发';
                showDate = depart;
            } else if (arrive) {
                showType = '首次抵达';
                showDate = arrive;
            }
            if (showType && showDate) {
                const d = showDate.split('-');
                const dateStr = `${d[0]}.${parseInt(d[1],10)}.${parseInt(d[2],10)}`;
                popup += `<br>${showType}: <b>${dateStr}</b>`;
            }
            stationMarkers[name] = L.marker(coords, { icon: smallIcon })
                .addTo(map)
                .bindPopup(popup);
        });

        // 图钉默认全部加入地图；初始可见性与统计在统计面板就绪后由 updateRouteFilter 统一同步

        // ========= 统计面板 =========
        // 把 "1662 km" / "10:09:00" 解析为数值，汇总里程与时长。
        function parseDistanceKm(s) {
            const m = /([\d.]+)/.exec(s || '');
            return m ? parseFloat(m[1]) : 0;
        }
        function parseDurationHours(s) {
            const m = /^(\d+):(\d+):/.exec(s || '');
            return m ? parseInt(m[1], 10) + parseInt(m[2], 10) / 60 : 0;
        }

        const statsPanel = L.control({ position: 'bottomleft' });
        statsPanel.onAdd = () => {
            const div = L.DomUtil.create('div', 'stats-panel');
            div.id = 'stats-panel';
            return div;
        };
        statsPanel.addTo(map);

        // 依据当前筛选结果刷新统计面板（行程数 / 各类型 / 里程 / 时长 / 站点数）
        function updateStats(segments, stations) {
            const panel = document.getElementById('stats-panel');
            if (!panel) return;
            const byType = { Railway: 0, Airline: 0, Other: 0 };
            let totalKm = 0, totalHours = 0;
            segments.forEach(seg => {
                byType[seg.type] = (byType[seg.type] || 0) + 1;
                totalKm += parseDistanceKm(seg.distance);
                totalHours += parseDurationHours(seg.duration);
            });
            const stationCount = stations ? stations.size : 0;
            panel.innerHTML = `
              <h4 style="margin:4px 0">出行统计</h4>
              <div>总行程 <span class="num">${segments.length}</span> 次</div>
              <div>🚄 ${byType.Railway} · ✈️ ${byType.Airline} · 🚌 ${byType.Other}</div>
              <div>总里程 <span class="num">${totalKm.toLocaleString('en-US', { maximumFractionDigits: 0 })}</span> km</div>
              <div>总时长 <span class="num">${totalHours.toFixed(0)}</span> 小时</div>
              <div>途经 <span class="num">${stationCount}</span> 个站点</div>
            `;
        }

        // 统计面板就绪后再做一次初始筛选，使三块面板（控件/图钉/统计）状态一致
        updateRouteFilter();

        // ========= 热力图层（可选，插件缺失时静默跳过）=========
        let heatLayer = null;
        const heatToggle = document.getElementById('toggle-heat');
        if (heatToggle && typeof L.heatLayer === 'function') {
            const heatPoints = Object.values(locCoords).map(c => [c[0], c[1], 0.6]);
            heatLayer = L.heatLayer(heatPoints, { radius: 25, blur: 18, maxZoom: 8 });
            // 默认打开热力图，与复选框的 checked 状态一致
            if (heatToggle.checked) {
                heatLayer.addTo(map);
            }
            heatToggle.addEventListener('change', e => {
                if (e.target.checked) {
                    heatLayer.addTo(map);
                } else {
                    map.removeLayer(heatLayer);
                }
            });
        } else if (heatToggle) {
            // 插件未加载：禁用复选框，避免误导。
            heatToggle.disabled = true;
            heatToggle.parentElement.style.opacity = 0.5;
        }

        // 初始视图由 updateRouteFilter() 根据当前筛选（默认当前年份）的命中记录自动缩放，
        // 故此处不再对全部站点做一次性 fitBounds。

</script>
</body>
</html>
